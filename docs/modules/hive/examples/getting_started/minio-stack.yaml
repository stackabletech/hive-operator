---
releaseName: minio
name: minio
repo:
  name: bitnami
  url: https://charts.bitnami.com/bitnami/
version: 12.6.4
options:
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/minio
  clientImage:
    repository: bitnamilegacy/minio-client
  mode: standalone
  persistence:
    enabled: false
  auth:
    rootUser: hive
    rootPassword: hivehive
  defaultBuckets: hive
  resources:
    requests:
      memory: 1Gi
  service:
    type: NodePort

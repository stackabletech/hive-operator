---
apiVersion: v2
name: hive-operator
version: "0.0.0-dev"
appVersion: "0.0.0-dev"
description: "Kubernetes operator for Apache Hive. Deploy and run the Hive Metastore with the Stackable Data Platform (SDP)."
home: https://github.com/stackabletech/hive-operator
# One known use of this is the Artifact Hub (AH) listing which shows the logo.
# AH downloads the logo and re-hosts it.
# We opted to not use the project logos (e.g. the Apache Spark logo) here due to trademark concerns.
icon: https://raw.githubusercontent.com/stackabletech/hive-operator/main/.readme/static/borrowed/Icon_Stackable.svg
sources:
  - https://github.com/stackabletech/hive-operator
keywords: ["apache-hive", "hive", "hive-metastore", "metastore", "kubernetes", "operator", "big-data"]
maintainers:
  - name: Stackable
    url: https://www.stackable.tech
# Consumed by Artifact Hub, see https://artifacthub.io/docs/topics/annotations/helm/
annotations:
  # The chart package ships no LICENSE file, so Artifact Hub cannot detect this itself.
  artifacthub.io/license: OSL-3.0
  # A link named "support" is rendered highlighted by Artifact Hub. Keep it lowercase.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.stackable.tech/home/stable/hive/
    - name: support
      url: https://github.com/stackabletech/hive-operator/issues
  artifacthub.io/crds: |-
    - kind: HiveCluster
      version: v1alpha1
      name: hiveclusters.hive.stackable.tech
      displayName: HiveCluster
      description: A Hive cluster stacklet. This resource is managed by the Stackable operator for Apache Hive.

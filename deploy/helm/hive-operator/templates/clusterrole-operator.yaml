---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hive-operator.fullname" . }}-clusterrole
  labels:
  {{- include "hive-operator.labels" . | nindent 4 }}
rules:
  # For automatic cluster domain detection
  - apiGroups:
      - ""
    resources:
      - nodes/proxy
    verbs:
      - get
  # Manage core workload resources created per HiveCluster (the ServiceAccount
  # provides workload pod identity). All resources are applied via Server-Side Apply
  # (create + patch), tracked for orphan cleanup (list + delete) and watched by the
  # controller.
  - apiGroups:
      - ""
    resources:
      - configmaps
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # RoleBinding created per HiveCluster to bind the product ClusterRole to the workload
  # ServiceAccount. Applied via SSA and tracked for orphan cleanup and watched by the controller.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # Required to bind the product ClusterRole to the per-cluster ServiceAccount.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      - bind
    resourceNames:
      - {{ include "hive-operator.name" . }}-clusterrole
  # StatefulSet created per role group. Applied via SSA, tracked for orphan cleanup, and
  # owned by the controller.
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # PodDisruptionBudget created per role. Applied via SSA and tracked for orphan cleanup
  # and watched by the controller.
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # Required for maintaining the CRDs within the operator (including the conversion webhook info).
  # Also for the startup condition check before the controller can run.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      # Required to maintain the CRD. The operator needs to do this, as it needs to enter e.g. it's
      # generated certificate in the conversion webhook.
      {{- if .Values.maintenance.customResourceDefinitions.maintain }}
      - create
      - patch
      {{- end }}
      # Required for startup condition
      - list
      - watch
  # Required to report reconciliation results and warnings back to the HiveCluster object.
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  # Primary CRD: watched by Controller::new() and read during reconciliation.
  - apiGroups:
      - {{ include "hive-operator.name" . }}.stackable.tech
    resources:
      - {{ include "hive-operator.name" . }}clusters
    verbs:
      - get
      - list
      - watch
  # Status subresource: updated at the end of every reconciliation.
  - apiGroups:
      - {{ include "hive-operator.name" . }}.stackable.tech
    resources:
      - {{ include "hive-operator.name" . }}clusters/status
    verbs:
      - patch
  # Read S3Connection configuration referenced in the HiveCluster spec.
  - apiGroups:
      - s3.stackable.tech
    resources:
      - s3connections
    verbs:
      - get
      - list
      - watch
  # Listener created per role for external access. Applied via SSA and tracked for orphan
  # cleanup. Watched by the controller, so a reconciliation is triggered once the
  # listener-operator writes the ingress address (needed for the discovery ConfigMap).
  - apiGroups:
      - listeners.stackable.tech
    resources:
      - listeners
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch

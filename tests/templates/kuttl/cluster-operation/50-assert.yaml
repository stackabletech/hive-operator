---
# The recreated StatefulSet must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the HiveCluster so that garbage
# collection still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 600
commands:
  - script: kubectl -n "$NAMESPACE" wait --for=condition=available hiveclusters.hive.stackable.tech/test-hive --timeout 601s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-hive-metastore-default
  ownerReferences:
    - apiVersion: hive.stackable.tech/v1alpha1
      controller: true
      kind: HiveCluster
      name: test-hive
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-hive-serviceaccount
  ownerReferences:
    - apiVersion: hive.stackable.tech/v1alpha1
      controller: true
      kind: HiveCluster
      name: test-hive
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-hive-rolebinding
  ownerReferences:
    - apiVersion: hive.stackable.tech/v1alpha1
      controller: true
      kind: HiveCluster
      name: test-hive
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-hive-metastore
  ownerReferences:
    - apiVersion: hive.stackable.tech/v1alpha1
      controller: true
      kind: HiveCluster
      name: test-hive
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: test-hive-metastore
  ownerReferences:
    - apiVersion: hive.stackable.tech/v1alpha1
      controller: true
      kind: HiveCluster
      name: test-hive
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-hive
  ownerReferences:
    - apiVersion: hive.stackable.tech/v1alpha1
      controller: true
      kind: HiveCluster
      name: test-hive
---
apiVersion: v1
kind: Service
metadata:
  name: test-hive-metastore-default-headless
  ownerReferences:
    - apiVersion: hive.stackable.tech/v1alpha1
      controller: true
      kind: HiveCluster
      name: test-hive
---
apiVersion: v1
kind: Service
metadata:
  name: test-hive-metastore-default-metrics
  ownerReferences:
    - apiVersion: hive.stackable.tech/v1alpha1
      controller: true
      kind: HiveCluster
      name: test-hive

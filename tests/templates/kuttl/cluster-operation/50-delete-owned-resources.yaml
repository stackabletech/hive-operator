# Every resource the operator applies carries an ownerReference and a `.owns()` watch
# (main.rs); deleting it must trigger a reconcile of the HiveCluster, which re-applies
# it. This step checks that chain — the ClusterRole's `watch` verbs plus the `.owns()`
# routing — and lives here because this test already cycles the pods. The `.watches()`
# registration (referenced-but-unowned ConfigMaps) can't be tested by deletion: the
# operator never recreates what it didn't apply.
#
# Recreation is proven by UID change: mere existence could pass without any deletion.
# TestStep commands run exactly once (no kuttl retry loop), so the polling stays quiet.
#
# The ConfigMap deleted here is the discovery one, named after the cluster.
# Deliberately skipped: the role-group ConfigMap (test-hive-metastore-default) —
# `.owns(ConfigMap)` is already exercised via the discovery ConfigMap, and deleting a
# ConfigMap mounted into running pods would disturb them. The Listener's backing
# Service is created by the listener-operator, not this operator, so only the Listener
# itself is deleted.
---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
metadata:
  name: delete-owned-resources
timeout: 300
commands:
  - script: |
      set -eu

      delete_and_await_recreation() {
        kind=$1
        name=$2
        old_uid=$(kubectl get -n "$NAMESPACE" "$kind" "$name" -o jsonpath='{.metadata.uid}')
        kubectl delete -n "$NAMESPACE" "$kind" "$name" --wait=false
        # Recreation is a single reconcile away, so this normally succeeds on the
        # first iteration; 30s is a generous upper bound well below the step timeout.
        for _ in $(seq 1 30); do
          new_uid=$(kubectl get -n "$NAMESPACE" "$kind" "$name" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
          if [ -n "$new_uid" ] && [ "$new_uid" != "$old_uid" ]; then
            return 0
          fi
          sleep 1
        done
        echo "$kind/$name was not recreated (old uid: $old_uid, current: '${new_uid:-}')" >&2
        return 1
      }

      delete_and_await_recreation serviceaccount       test-hive-serviceaccount
      delete_and_await_recreation rolebinding          test-hive-rolebinding
      delete_and_await_recreation poddisruptionbudget  test-hive-metastore
      delete_and_await_recreation listener             test-hive-metastore
      delete_and_await_recreation configmap            test-hive
      delete_and_await_recreation service              test-hive-metastore-default-headless
      delete_and_await_recreation service              test-hive-metastore-default-metrics
      delete_and_await_recreation statefulset          test-hive-metastore-default

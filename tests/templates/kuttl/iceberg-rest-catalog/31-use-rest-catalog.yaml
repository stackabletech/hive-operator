---
# Use the Thrift API and the REST catalog side by side, e.g. while migrating clients one by one.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      sh trino-query.sh "
        INSERT INTO iceberg_rest.sales.orders SELECT 4, 'date'
          WHERE NOT EXISTS (SELECT 1 FROM iceberg_rest.sales.orders WHERE id = 4);
        INSERT INTO iceberg_thrift.sales.orders SELECT 5, 'elderberry'
          WHERE NOT EXISTS (SELECT 1 FROM iceberg_thrift.sales.orders WHERE id = 5);
        CREATE SCHEMA IF NOT EXISTS iceberg_rest.marketing;
        CREATE TABLE IF NOT EXISTS iceberg_rest.marketing.campaigns AS
          SELECT * FROM (VALUES (1, 'launch'), (2, 'sale')) AS t (id, name);
      "

---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
commands:
  # Via the Thrift API: One data file per partition (3 partitions) and no delete files left
  - script: test "$(sh trino-query.sh 'SELECT count(*) FILTER (WHERE content = 0), count(DISTINCT partition), count(*) FILTER (WHERE content <> 0) FROM iceberg_thrift.sales."orders$files"')" = 3,3,0
  - script: test "$(sh trino-query.sh 'SELECT operation FROM iceberg_thrift.sales."orders$snapshots" ORDER BY committed_at DESC LIMIT 1')" = replace
  - script: sh orders.sh iceberg_thrift | diff 33_orders.csv -
  - script: sh compare-catalogs.sh

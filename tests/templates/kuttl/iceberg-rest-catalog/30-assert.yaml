---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
commands:
  # The Thrift API is still available
  - script: kubectl -n "$NAMESPACE" get cm hive -o json | jq -e '.data.HIVE'
  # The existing Iceberg table shows up in the REST catalog. The plain Hive table and the Trino view
  # (stored as Hive view) do not.
  - script: test "$(sh trino-query.sh 'SHOW TABLES FROM iceberg_rest.sales')" = orders
  # The content, including complex types, timestamps and NULLs, is the same via both APIs
  - script: sh orders.sh iceberg_rest | diff 21_orders.csv -
  - script: sh compare-catalogs.sh
  # The partitioning and the table history are kept. The second snapshot is the first INSERT (the
  # first one is the CREATE TABLE).
  - script: test "$(sh trino-query.sh 'SELECT count(*) FROM iceberg_rest.sales."orders$partitions"')" = 2
  - script: |
      SNAPSHOT=$(sh trino-query.sh 'SELECT snapshot_id FROM iceberg_rest.sales."orders$snapshots" ORDER BY committed_at OFFSET 1 LIMIT 1')
      test "$(sh trino-query.sh "SELECT count(*) FROM iceberg_rest.sales.orders FOR VERSION AS OF $SNAPSHOT")" = 2
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: hive-metastore
spec:
  ports:
    - name: hive
      port: 9083
      protocol: TCP
    - name: iceberg-rest
      port: 9001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore-default-headless
spec:
  ports:
    - name: hive
      port: 9083
      protocol: TCP
      targetPort: 9083
    - name: iceberg-rest
      port: 9001
      protocol: TCP
      targetPort: 9001
